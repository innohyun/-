</head><body><main id="app" class="app"></main><script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js" defer></script><script>
(()=>{'use strict';
const el=document.getElementById('app');const TYPES={solar:{name:'태양광',icon:'☀️',short:'태양광',base:73,maint:8,color:'#ffcc6f'},wind:{name:'풍력',icon:'🌬️',short:'풍력',base:73,maint:9,color:'#78d9d2'},wave:{name:'해양',icon:'🌊',short:'해양',base:77,maint:10,color:'#83b5fa'}};
const TERRA={plain:{name:'평지',icon:'·'},sunny:{name:'양지',icon:'☀'},hill:{name:'언덕',icon:'▲'},forest:{name:'숲',icon:'♣'},coast:{name:'해안',icon:'≈'}};
const uid=()=>Math.random().toString(36).slice(2,10);const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const money=x=>Math.round(x).toLocaleString('ko-KR');const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icons=['🦊','🐼','🐻','🐧'];const initialTerrain=['hill','plain','sunny','plain','forest','coast','plain','sunny','plain','plain','plain','coast','forest','plain','hill','plain','sunny','coast','plain','forest','plain','hill','plain','coast','sunny','plain','plain','forest','plain','coast','plain','hill','plain','sunny','plain','coast'];
let mode='solo',setupMode='solo',setupBots=2,setupCount=2,myId='p0',isHost=true,state=null,peer=null,connections={},hostConnection=null,selectedPlant=null,toastMessage='',toastTimer=null,lastFailure='';let localNick=localStorage.getItem('energy-nickname')||'';const RECORD='energy-market-records-v2';
const records=()=>{try{return JSON.parse(localStorage.getItem(RECORD)||'[]')}catch{return[]}};
const score=p=>Math.round(p.coins+p.plants.length*27+p.gridLevel*32+p.batteryLevel*25+p.insight*22+p.greenBonus*15+p.reputation);
const winnerSort=()=>[...state.players].sort((a,b)=>score(b)-score(a));
const nameOf=id=>state.players.find(p=>p.id===id)?.name||'선수';
const currentPlayer=()=>state?.players.find(p=>p.id===myId)||state?.players[0];
const isSolo=()=>state?.mode==='solo';
function showToast(msg){toastMessage=msg;renderToast();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastMessage='';renderToast()},3400)}
function renderToast(){document.querySelector('#toast')?.remove();if(toastMessage)document.body.insertAdjacentHTML('beforeend',`<div id="toast" class="toast">${safe(toastMessage)}</div>`)}
function makePlayer(id,name,ai=false){return{id,name:name.slice(0,14),ai,coins:260,plants:[],pending:[],bids:{},locked:false,ready:false,terrain:[...initialTerrain],gridLevel:0,batteryLevel:0,insight:0,greenBonus:0,reputation:0,stored:0,actionUsed:false,log:[],history:[],electricTotal:0}}
function makeRound(){const forecast={sun:rnd(24,88),wind:rnd(20,88),wave:rnd(25,85)};const lots=[];let types=Object.keys(TYPES).sort(()=>Math.random()-.5);for(let i=0;i<2;i++)lots.push({id:`${state.round}-${i}`,type:types[i],edition:rnd(1,9)});return{forecast,uncertainty:rnd(18,32),lots,weather:null,auctionResults:[],reports:[]}}
function startGame(players,gameMode,roomCode=''){state={mode:gameMode,roomCode,round:1,rounds:8,phase:'auction',players,roundData:null,previous:null,startedAt:Date.now()};state.roundData=makeRound();selectedPlant=null;render();sync()}
function saveResult(){if(!state||state.phase!=='end')return;const me=currentPlayer(), win=winnerSort()[0]?.id===myId;const rec=records();rec.push({name:me.name,score:score(me),rank:winnerSort().findIndex(p=>p.id===myId)+1,date:new Date().toISOString().slice(0,10),win,rounds:state.rounds});rec.sort((a,b)=>b.score-a.score);localStorage.setItem(RECORD,JSON.stringify(rec.slice(0,15)))}
function topbar(){const my=currentPlayer();return `<header class="topbar"><div class="brand"><div class="brand-mark">⚡</div><span class="brand-text">ENERGY <span class="accent">MARKET</span></span></div><div class="top-status">${state?`<span class="pill">${state.round<=state.rounds?`ROUND ${String(state.round).padStart(2,'0')} / ${state.rounds}`:'FINAL'}</span><span class="pill active">🪙 ${money(my.coins)}</span>`:`<span class="pill">에너지 전략 경매</span>`}<button class="btn ghost small" data-act="home">⌂ 홈</button></div></header>`}
function heroGrid(){let a=initialTerrain.map((x,i)=>({terrain:x,plant:i===2?'solar':i===14?'wind':i===23?'wave':null}));return drawGrid(a,false,true)}
function drawGrid(arr,interactive=false,decor=false,ownerId=''){return `<div class="city-grid">${arr.map((o,i)=>{const terrain=decor?o.terrain:o.terrain;const plant=decor?o.plant:o.plant;const type=plant&&TYPES[plant];const sel=interactive&&selectedPlant&&canPlace(currentPlayer(),selectedPlant,i);return `<button type="button" class="tile ${terrain} ${sel?'placeable':''}" ${interactive?`data-tile="${i}"`:'disabled'} title="${TERRA[terrain].name}${type?' / '+type.name:''}"><span class="symbol ${!type?'terrain-icon':''}">${type?type.icon:(terrain==='coast'?'🌊':terrain==='forest'?'🌲':terrain==='hill'?'⛰️':terrain==='sunny'?'🌼':'·')}</span>${!type?`<span class="mini">${TERRA[terrain].name}</span>`:''}</button>`}).join('')}</div>`}
function home(){const best=records()[0];return `${topbar()}<section class="hero"><div><div class="eyebrow">THE FUTURE IS UP FOR BID</div><h1>에너지를<br><span>예측하라.</span><br>도시를 지배하라.</h1><p class="hero-desc">일기예보를 분석하고 경쟁자보다 현명하게 입찰하세요. 태양광·풍력·해양 발전소를 원하는 땅에 건설하고, 변덕스러운 날씨 속에서 가장 부유한 에너지 도시를 만드세요.</p><div class="hero-actions"><button class="btn primary big" data-act="new-solo">🤖 AI 대결 시작 →</button><button class="btn outline big" data-act="new-online">🌐 친구들과 온라인</button></div>${best?`<div class="home-record"><span style="font-size:30px">🏆</span><div><div class="sm muted">이 기기의 최고 기록</div><div style="font-size:19px;font-weight:900">${money(best.score)}점 <span class="tiny muted">· ${safe(best.name)}</span></div></div></div>`:''}</div><div class="hero-map">${heroGrid()}<div class="between" style="padding:13px 3px 0"><b>🌆 나의 미니 에너지 도시</b><span class="badge">6 × 6 GRID</span></div></div></section><section class="grid3"><div class="panel pad"><div class="accent sm strong">01 / 예측</div><h3 style="margin:9px 0">🌤️ 복합 날씨 예보</h3><p class="muted sm">햇빛·바람·파도의 예상치를 보고 투자 위험을 계산하세요.</p></div><div class="panel pad"><div class="accent sm strong">02 / 경쟁</div><h3 style="margin:9px 0">🔨 비밀 입찰 경매</h3><p class="muted sm">동시에 가격을 제시합니다. 높은 입찰가가 항상 좋은 투자는 아닙니다.</p></div><div class="panel pad"><div class="accent sm strong">03 / 성장</div><h3 style="margin:9px 0">🏙️ 나만의 도시 건설</h3><p class="muted sm">땅의 특성과 송전 용량을 고려해야 이익이 늘어납니다.</p></div></section><footer class="foot">AI 대결은 별도 가입 없이 바로 플레이 · 온라인 대결은 WebRTC 연결 사용 · 최고 기록은 현재 기기에 저장</footer>`}
function setupPage(){return `${topbar()}<div class="setup"><div class="eyebrow">NEW GAME</div><h1>${setupMode==='solo'?'AI와 대결하기':'친구와 실시간 대결'}</h1><p class="heading-sub">게임은 8라운드로 진행되며 각 라운드마다 두 발전권을 경매합니다.</p><div class="panel pad stack"><div class="field"><label>내 닉네임</label><input class="input" id="nickname" maxlength="14" placeholder="예: 번개왕" value="${safe(localNick)}" /></div>${setupMode==='solo'?`<div class="field"><label>AI 경쟁자 수</label><div class="option-tabs" id="bot-options">${[1,2,3].map(n=>`<button data-bots="${n}" class="${setupBots===n?'selected':''}">${n}명</button>`).join('')}</div></div><div class="notification">💡 AI는 예보·경매 가격·보유 발전소를 참고해 입찰합니다. 운뿐 아니라 낙찰가와 도시 운영이 중요해요.</div><button class="btn primary big block" data-act="start-solo">게임 시작하기 →</button>`:`<div class="option-tabs">${['create','join'].map((x,i)=>`<button data-tab="${x}" class="${roomTab===x?'selected':''}">${i?'방 참가하기':'방 만들기'}</button>`).join('')}</div>${roomTab==='create'?`<div class="grid2"><div class="field"><label>방 이름</label><input id="room-name" class="input" value="${safe(roomName)}" maxlength="22" placeholder="예: 우리 반 에너지 대결" /></div><div class="field"><label>참가 인원</label><select id="player-count" class="input">${[2,3,4].map(n=>`<option value="${n}" ${setupCount===n?'selected':''}>${n}명</option>`).join('')}</select></div></div><button class="btn primary big block" data-act="create-room">🔗 방 만들기</button>`:`<div class="field"><label>참가할 방 코드</label><input id="join-code" class="input" maxlength="7" value="${safe(joinCode)}" placeholder="6자리 방 코드" style="text-transform:uppercase;letter-spacing:3px" /></div><button class="btn primary big block" data-act="join-room">방 참가하기 →</button>`}<div class="notification external-warning">⚠️ 실시간 대결은 인터넷 연결 및 외부 WebRTC 중계 서버가 필요합니다. 학교 네트워크에서는 연결이 제한될 수 있으며 방장이 나가면 게임도 종료됩니다.</div>`}</div></div>`}
let roomTab='create',roomName='에너지 대결',joinCode='';
function lobby(){const code=state.roomCode;let list=state.players;return `${topbar()}<div class="setup"><div class="eyebrow">LIVE ROOM</div><h1>${safe(state.roomName||'친구들과 에너지 대결')}</h1><div class="panel pad stack"><div class="between"><div><h3>참가 코드</h3><p class="muted sm">친구에게 이 코드를 알려주세요.</p></div><span class="badge">${list.length} / ${state.limit}명</span></div><div class="room-code">${safe(code)}</div><div class="flex"><button class="btn outline block" data-act="copy-room">🔗 초대 주소 복사</button><button class="btn ghost" data-act="copy-code">코드 복사</button></div><h3>참가자</h3>${Array.from({length:state.limit},(_,i)=>{const p=list[i];return `<div class="player-row"><span class="avatar">${icons[i]}</span><div style="flex:1;font-weight:800">${p?safe(p.name):'<span class="muted">참가자를 기다리는 중...</span>'}</div><span class="badge">${p?i===0?'방장':'참가 완료':'빈 자리'}</span></div>`}).join('')}<div class="notification">${isHost?'모든 친구가 참가하면 게임 시작 버튼이 활성화됩니다.':'방장이 게임을 시작하면 자동으로 이동합니다.'}</div>${isHost?`<button class="btn primary big block" data-act="host-start" ${list.length!==state.limit?'disabled':''}>${list.length===state.limit?'경매 시작 →':'참가자 기다리는 중...'}</button>`:''}</div></div>`}
function weatherMini(v,unc,insight){const x=clamp(unc-insight*9,6,35);return [['sun','☀️','햇빛','#ffd174'],['wind','🌬️','바람','#72e2d2'],['wave','🌊','파도','#7daefe']].map(([k,icon,label,c])=>`<div class="weather-card"><div class="weather-head"><span class="mini-weather">${icon} ${label}</span><b style="color:${c}">${v[k]}%</b></div><div class="weather-bar"><div class="weather-fill" style="width:${v[k]}%;background:${c}"></div></div><div class="tiny muted" style="margin-top:7px">예상 범위 ${clamp(v[k]-x,0,100)}~${clamp(v[k]+x,0,100)}%</div></div>`).join('')}
function leftColumn(){const p=currentPlayer();return `<aside class="col left-col"><div class="panel pad"><div class="phase-tag">MY PORTFOLIO</div><div class="between" style="margin:10px 0"><div><div class="tiny muted">보유 코인</div><div class="info-value gold">${money(p.coins)} <span class="tiny">🪙</span></div></div><span style="font-size:32px">${icons[Math.max(0,state.players.findIndex(x=>x.id===p.id))%4]}</span></div><div class="stat-row"><span class="muted">총자산</span><b>${money(score(p))}점</b></div><div class="stat-row"><span class="muted">건설한 발전소</span><b>${p.plants.length}개</b></div><div class="stat-row"><span class="muted">송전 용량</span><b>${90+p.gridLevel*40} kWh</b></div><div class="stat-row"><span class="muted">배터리 저장량</span><b>${p.stored}/${p.batteryLevel*45}</b></div></div><div class="panel pad"><div class="between"><div class="section-title" style="margin:0">🌤️ 내일의 날씨 예보</div><span class="badge">예측</span></div><div class="stack" style="margin-top:13px;gap:8px">${weatherMini(state.roundData.forecast,state.roundData.uncertainty,p.insight)}</div><p class="subtle" style="line-height:1.7;margin-top:10px">세 날씨가 동시에 영향을 줍니다. 실제 날씨는 발전 시 공개됩니다.</p></div></aside>`}
function rightColumn(){return `<aside class="col right-col"><div class="panel pad"><div class="between" style="margin-bottom:10px"><span class="section-title" style="margin:0">🏆 실시간 순위</span><span class="tiny muted">총자산</span></div>${winnerSort().map((p,i)=>`<div class="leader-row ${p.id===myId?'me':''}"><div class="rank">${i+1}</div><div><b>${icons[state.players.findIndex(x=>x.id===p.id)%4]} ${safe(p.name)}</b><div class="tiny muted">🪙 ${money(p.coins)} · 발전소 ${p.plants.length}</div></div><b>${money(score(p))}</b></div>`).join('')}</div><div class="panel pad"><h3 class="section-title">📈 이번 라운드 진행</h3><div class="round-dots">${Array.from({length:state.rounds},(_,i)=>`<span class="${i+1<state.round?'past':i+1===state.round?'current':''}"></span>`).join('')}</div><div class="divider"></div><div class="steps">${[['auction','① 경매'],['reveal','② 낙찰'],['build','③ 도시'],['result','④ 정산']].map(([k,t])=>`<span class="pill ${state.phase===k?'now':''}">${t}</span>`).join('')}</div></div><div class="panel pad"><div class="section-title">💡 투자 도움말</div><p class="sm muted" style="line-height:1.8">발전소는 매 라운드 수익을 내지만 유지비도 듭니다. 도시의 송전 용량을 넘는 전기는 팔 수 없어요. 비싼 낙찰보다 적절한 가격이 중요합니다.</p></div></aside>`}
function cityFor(p,interactive){const board=p.terrain.map((terrain,i)=>({terrain,plant:p.plants.find(a=>a.tile===i)?.type||null}));return drawGrid(board,interactive)}
function centerView(){const p=currentPlayer(),phase=state.phase;const header=`<div class="between" style="margin-bottom:14px"><div><div class="eyebrow" style="margin:0 0 4px">ROUND ${String(state.round).padStart(2,'0')} / ${state.rounds}</div><h2>${phase==='auction'?'🔨 비밀 입찰 경매':phase==='reveal'?'🎉 경매 낙찰 결과':phase==='build'?'🏙️ 도시 건설과 개발':phase==='result'?'📊 발전 수익 정산':'🏆 최종 순위'}</h2></div><span class="badge">${phase==='auction'?'비공개 입찰':phase==='reveal'?'결과 공개':phase==='build'?'시설 배치':phase==='result'?'날씨 공개':'결과'}</span></div>`;
 if(phase==='auction')return `${header}<div class="panel pad"><p class="heading-sub" style="margin-bottom:14px">원하는 발전권마다 코인을 입찰하세요. 동시에 입찰하며 <b>가장 높은 가격</b>을 제시한 사람이 낙찰받습니다. 낙찰받은 발전소는 남은 라운드에도 작동해요.</p><div class="cards">${state.roundData.lots.map(l=>`<div class="lot"><span class="tag">발전권 ${l.id.split('-')[1]==='0'?'A':'B'} · 유지비 ${TYPES[l.type].maint}/일</span><span class="lot-icon">${TYPES[l.type].icon}</span><div class="lot-title">${TYPES[l.type].name} 발전소</div><p class="subtle" style="margin-top:6px">최대 생산량 ${TYPES[l.type].base} kWh/일</p><div class="field" style="margin-top:13px"><label>나의 비밀 입찰가</label><input type="number" class="input bid" data-bid="${l.id}" min="0" max="999" step="5" value="${p.bids[l.id]??0}" ${p.locked?'disabled':''}/></div><p class="tiny muted" style="margin-top:6px">0코인은 입찰 포기</p></div>`).join('')}</div><div class="between" style="margin-top:18px"><div class="sm muted">입찰 총액 <b class="gold" id="bid-total">${money(state.roundData.lots.reduce((a,l)=>a+(p.bids[l.id]||0),0))}</b> / ${money(p.coins)} 코인</div><button class="btn yellow" data-act="lock-bids" ${p.locked?'disabled':''}>${p.locked?'입찰 제출 완료 ✓':'입찰 확정 →'}</button></div>${p.locked?`<div class="notification notice-good" style="margin-top:12px">${state.players.filter(x=>x.locked).length}/${state.players.length}명 입찰 완료 · 다른 플레이어를 기다리는 중입니다.</div>`:''}</div><div class="panel pad" style="margin-top:15px"><b>📌 투자 전략</b><p class="sm muted" style="line-height:1.8;margin-top:7px">좋은 날씨여도 모든 사람이 그 발전소를 노리면 낙찰가가 높아집니다. 실제 날씨와 판매 한도를 고려해 지불할 가격을 결정하세요.</p></div>`;
 if(phase==='reveal')return `${header}<div class="panel pad"><p class="heading-sub">경쟁자가 제시한 가격이 공개되었습니다. 승리한 발전소를 자신의 도시 어디에 놓을지 결정하세요.</p>${state.roundData.auctionResults.map(r=>`<div class="result-item"><div class="flex"><div style="font-size:31px">${TYPES[r.type].icon}</div><div><b>${TYPES[r.type].name}</b><div class="sm muted">${r.winner?`${safe(nameOf(r.winner))} 낙찰`:'아무도 입찰하지 않음'}</div></div></div><div style="text-align:right"><div class="gold strong">${r.price?r.price+' 🪙':'유찰'}</div>${r.winner===myId?'<span class="badge winner">내가 낙찰!</span>':''}</div></div>`).join('')}<div class="divider"></div>${isHost?`<button class="btn primary big block" data-act="to-build">도시 건설로 이동 →</button>`:`<div class="notification">방장이 건설 단계로 이동할 때까지 기다려 주세요.</div>`}</div>`;
 if(phase==='build')return `${header}<div class="panel pad"><div class="between" style="margin-bottom:9px"><div><h3>나의 에너지 도시</h3><div class="subtle" style="margin-top:5px">낙찰받은 발전소를 선택하고 빈 칸을 누르세요.</div></div><span class="badge">설치 대기 ${p.pending.length}개</span></div>${cityFor(p,!p.ready)}<div class="terrain-legend">${Object.keys(TERRA).map(t=>`<span><span class="energy-key" style="background:${({plain:'#4e866d',sunny:'#ddbc68',hill:'#90afa0',forest:'#297960',coast:'#328caf'})[t]}"></span>${TERRA[t].name}</span>`).join('')}</div><div class="divider"></div><h3 class="section-title">🧰 건설 대기 발전소</h3><div class="inventory">${p.pending.length?p.pending.map(plant=>`<button class="chip ${selectedPlant===plant.id?'selected':''}" data-select-plant="${plant.id}" ${p.ready?'disabled':''}>${TYPES[plant.type].icon} ${TYPES[plant.type].name} 설치</button>`).join(''):'<span class="muted sm">설치할 발전소가 없습니다.</span>'}</div><p class="subtle">☀ 양지의 태양광 +25% · ▲ 언덕의 풍력 +30% · 🌊 해안에서 해양 발전 가능 · ♣ 숲 개발 비용 15코인</p><div class="divider"></div><h3 class="section-title">🏗️ 도시 개발 (라운드당 1개)</h3><div class="action-list"><button class="action-item" data-upgrade="grid" ${p.actionUsed||p.coins<65||p.gridLevel>=3||p.ready?'disabled':''}>🔌 <div><b>송전망 확장</b><div class="subtle">하루 판매 한도 +40</div></div><span class="cost">65 🪙</span></button><button class="action-item" data-upgrade="battery" ${p.actionUsed||p.coins<50||p.batteryLevel>=3||p.ready?'disabled':''}>🔋 <div><b>배터리 건설</b><div class="subtle">전력 저장 한도 +45</div></div><span class="cost">50 🪙</span></button><button class="action-item" data-upgrade="insight" ${p.actionUsed||p.coins<48||p.insight>=2||p.ready?'disabled':''}>🔭 <div><b>예보 연구소</b><div class="subtle">내 예보 오차범위 감소</div></div><span class="cost">48 🪙</span></button><button class="action-item" data-upgrade="green" ${p.actionUsed||p.coins<55||p.greenBonus>=2||p.ready?'disabled':''}>🏪 <div><b>친환경 시장</b><div class="subtle">판매 코인 +10%</div></div><span class="cost">55 🪙</span></button></div><div class="divider"></div><button class="btn primary big block" data-act="ready-build" ${p.pending.length||p.ready?'disabled':''}>${p.ready?'정산 준비 완료 ✓':'건설 완료 · 날씨 공개 →'}</button>${p.ready?`<div class="notification notice-good" style="margin-top:10px">${state.players.filter(x=>x.ready).length}/${state.players.length}명 준비 완료 · 다른 플레이어를 기다리는 중입니다.</div>`:''}</div>`;
 if(phase==='result')return `${header}<div class="panel pad"><div class="between" style="margin-bottom:17px"><h3>🌦️ 실제 날씨 공개!</h3><span class="badge">예보와 비교</span></div><div class="grid3">${[['sun','☀️','햇빛'],['wind','🌬️','바람'],['wave','🌊','파도']].map(([t,ico,n])=>`<div class="weather-card center"><div style="font-size:32px">${ico}</div><div class="sm muted">${n}</div><div class="info-value">${state.roundData.weather[t]}%</div><div class="tiny muted">예보 ${state.roundData.forecast[t]}%</div></div>`).join('')}</div><div class="divider"></div><h3 class="section-title">오늘의 전력 판매 보고서</h3>${state.roundData.reports.map(r=>`<div class="result-item"><div><b>${safe(nameOf(r.id))}</b><div class="tiny muted">발전 ${r.generated} kWh · 판매 ${r.sold} kWh · 유지비 ${r.maintenance}</div></div><div class="strong ${r.net>=0?'accent':'red'}">${r.net>=0?'+':''}${r.net} 🪙</div></div>`).join('')}<div class="notification" style="margin:14px 0">💡 기존 발전소도 전기를 생산하지만 판매 한도와 유지비가 있어 무한정 수익을 낼 수는 없습니다.</div>${isHost?`<button class="btn primary big block" data-act="next-round">${state.round===state.rounds?'최종 결과 보기 🏆':'다음 라운드 시작 →'}</button>`:`<div class="notification">방장이 다음 라운드를 시작하면 자동으로 이동합니다.</div>`}</div>`;
 return ''}
function gamePage(){return `${topbar()}<div class="game-layout">${leftColumn()}<section class="col" style="min-width:0">${centerView()}</section>${rightColumn()}</div><footer class="foot">🌱 모든 금액과 날씨·발전량은 게임용 가상 수치입니다. 실제 에너지 생산량을 나타내지 않습니다.</footer>`}
function endPage(){const ranks=winnerSort(),me=currentPlayer(),place=ranks.findIndex(x=>x.id===myId)+1;return `${topbar()}<div class="setup"><div class="panel pad center"><div class="final-cup">${place===1?'🏆':'🎖️'}</div><div class="eyebrow">SEASON COMPLETE</div><h1>${place===1?'우승을 축하합니다!':`${place}위로 마무리했어요!`}</h1><p class="heading-sub">8일간의 에너지 경매가 끝났습니다. 투자한 코인과 도시 자산을 합산한 결과예요.</p><div style="height:20px"></div>${ranks.map((p,i)=>`<div class="result-item"><div class="flex"><b class="rank" style="font-size:22px">${i+1}</b><span style="font-size:26px">${icons[state.players.findIndex(x=>x.id===p.id)%4]}</span><div style="text-align:left"><b>${safe(p.name)}</b><div class="sm muted">🪙 ${money(p.coins)} · 발전소 ${p.plants.length}개 · 누적 발전량 ${money(p.electricTotal)} kWh</div></div></div><b class="accent">${money(score(p))}점</b></div>`).join('')}<div class="hero-actions" style="justify-content:center"><button class="btn primary big" data-act="retry">다시 도전하기 ↻</button><button class="btn outline big" data-act="home">홈으로</button></div><div class="notification" style="margin-top:20px">최고 기록은 현재 브라우저에 저장됩니다. 온라인 전체 공용 순위표는 별도 서버 연결이 필요한 확장 기능입니다.</div></div></div>`}
function render(){if(!state){el.innerHTML=home();renderToast();return}el.innerHTML=state.phase==='lobby'?lobby():state.phase==='end'?endPage():gamePage();renderToast()}
function drawSetup(){state=null;el.innerHTML=setupPage();renderToast()}
function canPlace(p,plantId,i){const plant=p.pending.find(x=>x.id===plantId);if(!plant)return false;if(p.plants.some(x=>x.tile===i))return false;const land=p.terrain[i];if(plant.type==='wave')return land==='coast';return land!=='coast'}
function buildPlant(player,id,tile){if(state.phase!=='build'||player.ready)return false;if(!canPlace(player,id,tile))return false;const land=player.terrain[tile];if(land==='forest'&&player.coins<15)return false;if(land==='forest')player.coins-=15;const idx=player.pending.findIndex(x=>x.id===id);let plant=player.pending.splice(idx,1)[0];player.plants.push({...plant,tile});return true}
function doUpgrade(player,type){if(state.phase!=='build'||player.actionUsed||player.ready)return false;const costs={grid:65,battery:50,insight:48,green:55},keys={grid:'gridLevel',battery:'batteryLevel',insight:'insight',green:'greenBonus'},limit={grid:3,battery:3,insight:2,green:2};if(player.coins<costs[type]||player[keys[type]]>=limit[type])return false;player.coins-=costs[type];player[keys[type]]++;player.actionUsed=true;return true}
function calculateBid(p,l){const f=state.roundData.forecast[l.type==='solar'?'sun':l.type==='wind'?'wind':'wave'];const capacity=90+p.gridLevel*40;const likely=clamp(f*.65+25,10,90);const current=p.plants.length;const pressure=clamp(1-current*.18,.18,1);const value=clamp(Math.round( (31+likely*.51 + (state.rounds-state.round)*7)*pressure +rnd(-20,18)),12,145);return clamp(value,0,Math.floor(p.coins*.6))}
function botBid(p){let left=p.coins;for(const l of state.roundData.lots){let bid=Math.min(left,calculateBid(p,l));p.bids[l.id]=Math.max(0,bid);left-=bid}p.locked=true}
function lockBidFor(p,bids){if(p.locked||state.phase!=='auction')return false;let total=0;for(const l of state.roundData.lots){const raw=Number(bids[l.id]||0);if(!Number.isInteger(raw)||raw<0||raw>999)return false;total+=raw}if(total>p.coins)return false;p.bids={...bids};p.locked=true;return true}
function resolveAuction(){if(!state.players.every(x=>x.locked))return;const results=[];for(const lot of state.roundData.lots){const ranked=state.players.map(p=>({id:p.id,price:p.bids[lot.id]||0})).sort((a,b)=>b.price-a.price||(a.id>b.id?1:-1));const win=ranked[0];if(win.price>0){const p=state.players.find(x=>x.id===win.id);p.coins-=win.price;p.pending.push({id:uid(),type:lot.type,paid:win.price});results.push({type:lot.type,winner:p.id,price:win.price})}else results.push({type:lot.type,winner:null,price:0})}state.roundData.auctionResults=results;state.phase='reveal';sync();render()}
function autoBuild(p){for(const plant of [...p.pending]){const choices=p.terrain.map((t,i)=>({t,i,occupied:p.plants.some(x=>x.tile===i)})).filter(x=>!x.occupied&&(plant.type==='wave'?x.t==='coast':x.t!=='coast')&&(x.t!=='forest'||p.coins>=15)).map(x=>({...x,value:x.t==='sunny'&&plant.type==='solar'?50:x.t==='hill'&&plant.type==='wind'?56:x.t==='coast'&&plant.type==='wave'?60:x.t==='forest'?-30:10})).sort((a,b)=>b.value-a.value);if(choices.length)buildPlant(p,plant.id,choices[0].i)}if(!p.actionUsed){const priority=p.plants.length>=2&&!p.gridLevel?'grid':p.plants.length>=2&&!p.batteryLevel?'battery':p.plants.length>=3&&!p.greenBonus?'green':null;if(priority)doUpgrade(p,priority)}p.ready=true}
function endBuildIfReady(){if(!state.players.every(p=>p.ready))return;const forecast=state.roundData.forecast,delta=state.roundData.uncertainty;const actual={};for(const k of ['sun','wind','wave'])actual[k]=clamp(forecast[k]+rnd(-delta,delta),0,100);state.roundData.weather=actual;const reports=[];for(const p of state.players){const gen=p.plants.reduce((n,plant)=>{const t=TYPES[plant.type],kind=plant.type==='solar'?'sun':plant.type==='wind'?'wind':'wave';let mult=1;const terrain=p.terrain[plant.tile];if(terrain==='sunny'&&plant.type==='solar')mult+=.25;if(terrain==='hill'&&plant.type==='wind')mult+=.30;if(terrain==='coast'&&plant.type==='wave')mult+=.30;if(plant.type==='wind'&&p.plants.some(x=>x.id!==plant.id&&x.type==='wind'&&Math.abs(Math.floor(x.tile/6)-Math.floor(plant.tile/6))+Math.abs(x.tile%6-plant.tile%6)===1))mult-=.20;return n+Math.floor(t.base*actual[kind]/100*mult)},0);
const cap=90+p.gridLevel*40,storageCap=p.batteryLevel*45;const fromStorage=Math.min(p.stored,Math.max(0,cap-gen));const sold=Math.min(cap,gen+fromStorage);const usedFromStorage=Math.min(fromStorage,sold);const surplus=Math.max(0,gen-Math.max(0,sold-usedFromStorage));p.stored=Math.min(storageCap,p.stored-usedFromStorage+surplus);const maintenance=p.plants.reduce((s,x)=>s+TYPES[x.type].maint,0);const gross=Math.floor(sold*(1+p.greenBonus*.1));const net=gross-maintenance;p.coins+=net;p.electricTotal+=gen;if(sold>=65)p.reputation+=5;p.history.push({round:state.round,generated:gen,sold,gross,maintenance,net});reports.push({id:p.id,generated:gen,sold,gross,maintenance,net})}state.roundData.reports=reports;state.phase='result';sync();render()}
function nextRound(){if(state.round>=state.rounds){state.phase='end';if(isSolo())saveResult();sync();render();return}state.previous=state.roundData;state.round++;state.roundData=makeRound();for(const p of state.players){p.bids={};p.locked=false;p.ready=false;p.actionUsed=false;}state.phase='auction';selectedPlant=null;sync();render()}
function sync(){if(!isHost||state?.mode!=='online')return;for(const conn of Object.values(connections)){if(conn?.open)try{conn.send({type:'state',state})}catch(e){console.warn(e)}}}
function sendAction(act,data={}){if(isHost){const ok=handleGameAction(myId,act,data);if(ok){sync();render()}else showToast('이 행동은 지금 실행할 수 없습니다.')}else{if(!hostConnection?.open){showToast('방장과 연결이 끊겼습니다.');return}hostConnection.send({type:'action',action:act,data})}}
function handleGameAction(id,action,data){const p=state?.players.find(x=>x.id===id);if(!p||p.ai)return false;if(action==='bid'){const ok=lockBidFor(p,data.bids||{});if(ok&&state.players.every(x=>x.locked))resolveAuction();return ok}if(action==='place'){return buildPlant(p,String(data.id||''),Number(data.tile))}if(action==='upgrade')return doUpgrade(p,data.kind);if(action==='ready'){if(p.pending.length||p.ready||state.phase!=='build')return false;p.ready=true;endBuildIfReady();return true}return false}
function localBids(){let out={};document.querySelectorAll('[data-bid]').forEach(input=>out[input.dataset.bid]=Number(input.value||0));return out}
function startSolo(){const name=(document.getElementById('nickname')?.value||'플레이어').trim().slice(0,14)||'플레이어';localNick=name;localStorage.setItem('energy-nickname',name);disconnect();myId='p0';isHost=true;let players=[makePlayer('p0',name),...Array.from({length:setupBots},(_,i)=>makePlayer('bot'+i,['에너지박사','바람사냥꾼','파도고수'][i],true))];startGame(players,'solo')}
function onlineAvailable(){if(typeof window.Peer!=='function'){showToast('온라인 연결 기능을 불러오지 못했습니다. 인터넷을 확인해 주세요.');return false}return true}
function disconnect(){try{hostConnection?.close()}catch{}for(const c of Object.values(connections))try{c.close()}catch{}try{peer?.destroy()}catch{}peer=null;connections={};hostConnection=null;isHost=true}
function goHome(){disconnect();state=null;selectedPlant=null;render()}
function attachPeer(){peer.on('error',err=>{lastFailure=err?.type||'network';showToast('온라인 연결 오류: '+lastFailure);if(state?.phase==='lobby'&&!isHost){drawSetup()}});peer.on('disconnected',()=>showToast('중계 서버 연결이 끊겼습니다.'));}
function roomHost(){if(!onlineAvailable())return;const name=(document.getElementById('nickname')?.value||'방장').trim().slice(0,14)||'방장';localNick=name;localStorage.setItem('energy-nickname',name);roomName=(document.getElementById('room-name')?.value||'에너지 대결').trim().slice(0,22)||'에너지 대결';setupCount=Number(document.getElementById('player-count')?.value||2);disconnect();isHost=true;myId='host';const code=Math.random().toString(36).slice(2,8).toUpperCase();peer=new window.Peer('emk-2026-'+code.toLowerCase());attachPeer();peer.on('open',()=>{state={mode:'online',roomCode:code,roomName,limit:setupCount,round:1,rounds:8,phase:'lobby',players:[makePlayer('host',name)],roundData:null};history.replaceState(null,'','#room='+code);render()});peer.on('connection',conn=>{conn.on('data',msg=>{if(msg?.type==='join'){if(state?.phase!=='lobby'||state.players.length>=state.limit){conn.send({type:'error',message:'방이 가득 찼거나 게임이 이미 시작되었습니다.'});return}const requested=String(msg.name||'참가자').trim().slice(0,14);const id='p'+uid();const user=makePlayer(id,requested||'참가자');state.players.push(user);connections[id]=conn;conn.send({type:'assigned',id});sync();render()}else if(msg?.type==='action'){const id=Object.keys(connections).find(k=>connections[k]===conn);if(id){let ok=handleGameAction(id,msg.action,msg.data||{});if(ok){sync();render()}else conn.send({type:'error',message:'요청을 처리할 수 없습니다.'})}}});conn.on('close',()=>{const id=Object.keys(connections).find(k=>connections[k]===conn);if(id){delete connections[id];if(state?.phase==='lobby'){state.players=state.players.filter(x=>x.id!==id);sync();render()}else showToast(nameOf(id)+' 연결이 끊겼습니다.')}})})}
function roomJoin(){if(!onlineAvailable())return;const name=(document.getElementById('nickname')?.value||'참가자').trim().slice(0,14)||'참가자';localNick=name;localStorage.setItem('energy-nickname',name);const code=(document.getElementById('join-code')?.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7);if(code.length!==6){showToast('6자리 방 코드를 입력해 주세요.');return}disconnect();isHost=false;myId='pending';peer=new window.Peer();attachPeer();peer.on('open',()=>{hostConnection=peer.connect('emk-2026-'+code.toLowerCase(),{reliable:true});hostConnection.on('open',()=>{hostConnection.send({type:'join',name});showToast('방에 연결되었습니다. 참가자 정보를 기다립니다.')});hostConnection.on('data',msg=>{if(msg?.type==='assigned'){myId=msg.id;render()}else if(msg?.type==='state'){state=msg.state;render()}else if(msg?.type==='error'){showToast(msg.message)}});hostConnection.on('close',()=>{showToast('방장과 연결이 끊겼습니다.');if(state?.phase!=='end')setTimeout(goHome,2800)})})}
function hostStart(){if(!state||state.phase!=='lobby'||!isHost||state.players.length!==state.limit)return;state.round=1;state.roundData=makeRound();state.phase='auction';sync();render()}
function copyText(text){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>showToast('복사했습니다!')).catch(()=>showToast('복사를 허용해 주세요.'));else showToast('복사 기능을 사용할 수 없습니다.')}
function control(e){const target=e.target.closest('[data-act],[data-bots],[data-tab],[data-select-plant],[data-tile],[data-upgrade]');if(!target)return;const a=target.dataset;if(a.bots){setupBots=Number(a.bots);drawSetup();return}if(a.tab){roomTab=a.tab;localNick=document.getElementById('nickname')?.value||localNick;drawSetup();return}if(a.selectPlant){selectedPlant=a.selectPlant;render();return}if(a.tile!==undefined){if(!selectedPlant)return;const id=selectedPlant;if(isHost){if(handleGameAction(myId,'place',{id,tile:Number(a.tile)})){selectedPlant=null;sync();render()}else showToast('설치할 수 없는 지형이거나 코인이 부족합니다.')}else{selectedPlant=null;sendAction('place',{id,tile:Number(a.tile)})}return}if(a.upgrade){sendAction('upgrade',{kind:a.upgrade});return}switch(a.act){case 'home':goHome();break;case 'new-solo':setupMode='solo';drawSetup();break;case 'new-online':setupMode='online';drawSetup();break;case 'start-solo':startSolo();break;case 'create-room':roomHost();break;case 'join-room':roomJoin();break;case 'copy-room':copyText(location.origin+location.pathname+'#room='+state.roomCode);break;case 'copy-code':copyText(state.roomCode);break;case 'host-start':hostStart();break;case 'lock-bids':{const bids=localBids();const sum=Object.values(bids).reduce((a,b)=>a+b,0);if(Object.values(bids).some(x=>!Number.isInteger(x)||x<0||x>999)||sum>currentPlayer().coins){showToast('입찰 총액이 보유 코인을 넘거나 숫자가 올바르지 않습니다.');return}if(isSolo()){handleGameAction(myId,'bid',{bids});state.players.filter(x=>x.ai).forEach(botBid);resolveAuction();render()}else sendAction('bid',{bids});break}case 'to-build':if(!isHost||state.phase!=='reveal')return;state.phase='build';if(isSolo())state.players.filter(p=>p.ai).forEach(autoBuild);sync();render();break;case 'ready-build':sendAction('ready');break;case 'next-round':if(isHost&&state.phase==='result'){nextRound()}break;case 'retry':if(isSolo()){startSolo();return}goHome();break;}}
el.addEventListener('click',control);el.addEventListener('input',e=>{if(e.target.matches('[data-bid]')){let sum=Object.values(localBids()).reduce((a,b)=>a+b,0);let out=document.getElementById('bid-total');if(out){out.textContent=money(sum);out.className=sum>currentPlayer().coins?'red strong':'gold strong'}}});
if(location.hash.startsWith('#room=')){setupMode='online';roomTab='join';joinCode=location.hash.split('=')[1].toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);drawSetup()}else render();
})();
</script></body></html>
